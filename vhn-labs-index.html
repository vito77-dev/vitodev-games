h1,h2,.fr{font-family:'Fredoka',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---- barra lateral ---- */
.rail{
  position:fixed;top:var(--gap);left:var(--gap);width:var(--rail);z-index:20;
  display:flex;flex-direction:column;gap:10px;
}
.brand{
  background:var(--white);border-radius:20px;padding:14px 8px 12px;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.35);display:block;
}
.brand b{font-family:'Fredoka',sans-serif;font-weight:700;font-size:30px;line-height:1;color:var(--ink);letter-spacing:-.5px}
.brand b i{font-style:normal;color:var(--blue)}
.brand small{display:block;margin-top:4px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:12px;letter-spacing:.32em;color:var(--ink);padding-left:.32em}
.ib{
  width:100%;height:56px;border-radius:18px;background:var(--white);color:var(--ink);
  display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .15s,background .15s,color .15s;
}
.ib:hover{transform:translateY(-2px)}
.ib[aria-pressed="true"]{background:var(--blue);color:#fff}
.ib svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ---- painel de busca ---- */
.sp{
  position:fixed;top:var(--gap);left:calc(var(--rail) + var(--gap)*2);z-index:30;
  width:min(420px,calc(100vw - var(--rail) - var(--gap)*3));max-height:calc(100vh - var(--gap)*2);
  background:var(--white);color:var(--ink);border-radius:22px;padding:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.55);display:none;flex-direction:column;gap:12px;
}
.sp.on{display:flex}
.sp label{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px}
.sf{display:flex;align-items:center;gap:8px;background:#eef2ff;border:2px solid #d5deff;border-radius:14px;padding:0 12px}
.sf:focus-within{border-color:var(--blue)}
.sf svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.sf input{flex:1;min-width:0;height:46px;border:0;background:none;font:700 17px 'Nunito',sans-serif;color:var(--ink);outline:none}
.sf input::placeholder{color:#7b88b3;font-weight:600}
.sr{overflow:auto;display:flex;flex-direction:column;gap:6px}
.sr a{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;font-weight:800}
.sr a:hover,.sr a:focus-visible{background:#eef2ff}
.sr .th{width:48px;height:48px;border-radius:12px;overflow:hidden;flex:none}
.sr .th svg{width:100%;height:100%;display:block}
.sr p{padding:10px 4px;color:#5b6896;font-weight:700}

main{max-width:1500px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,var(--tile));gap:var(--gap);justify-content:start}
.tile{
  position:relative;width:var(--tile);height:var(--tile);border-radius:24px;overflow:hidden;display:block;

.tile:hover,.tile:focus-visible{transform:scale(1.045);box-shadow:0 14px 34px rgba(47,107,255,.35)}
.tile svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.tile .nm{

}
.tile .nm small{display:block;margin-bottom:3px;font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8fb0ff}
.vazio{padding:30px 4px;color:#8fa0d0;font-weight:700;display:none}
footer{margin-top:44px;padding-top:18px;border-top:1px solid #13224d;color:#7f8fbf;font-size:14px;max-width:760px}
footer b{font-family:'Fredoka',sans-serif;color:#cfdcff}

  .sp{top:78px;left:12px;width:calc(100vw - 24px);max-height:calc(100vh - 90px)}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .tile{width:100%;height:auto;aspect-ratio:1}
}
#play{position:fixed;inset:0;z-index:100;background:#000;display:none}
#play.on{display:block}
#play iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#sair{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:5;height:26px;padding:0 14px;border-radius:13px;background:rgba(255,255,255,.14);color:#fff;font:700 12px 'Nunito',sans-serif;letter-spacing:.04em;opacity:.55;backdrop-filter:blur(4px)}

function update(dt){
 if(ball){const n=Math.max(1,Math.ceil(SP*dt/(R*.35)));
  for(let i=0;i<n&&ball;i++){ball.x+=ball.vx*dt/n;ball.y+=ball.vy*dt/n;
   if(ball.x<LX+R){ball.x=LX+R;ball.vx=-ball.vx}else if(ball.x>LX+AW-R){ball.x=LX+AW-R;ball.vx=-ball.vx}
   let hit=ball.y<=TOP+R;
   if(!hit)for(let r=0;r<grid.length&&!hit;r++)for(let c=0;c<grid[r].length;c++)if(grid[r][c]!=null&&Math.hypot(px(r,c)-ball.x,py(r)-ball.y)<1.82*R){hit=true;break}
   if(hit){const b=ball;ball=null;snap(b)}}}
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);
 fall.forEach(f=>{f.vy+=1500*dt;f.x+=f.vx*dt;f.y+=f.vy*dt});fall=fall.filter(f=>f.y<H+R*2)}
function guide(){const o=[];let x=SX,y=SY,vx=Math.cos(ang),vy=-Math.sin(ang);const st=R*.5;
 for(let i=0;i<700;i++){x+=vx*st;y+=vy*st;if(x<LX+R){x=LX+R;vx=-vx}else if(x>LX+AW-R){x=LX+AW-R;vx=-vx}
  if(y<=TOP+R)break;let h=false;for(let r=0;r<grid.length&&!h;r++)for(let c=0;c<grid[r].length;c++)if(grid[r][c]!=null&&Math.hypot(px(r,c)-x,py(r)-y)<1.82*R){h=true;break}if(h)break;
  if(i%2==1)o.push([x,y])}return o}

 ctx.fillStyle='rgba(255,255,255,.04)';ctx.fillRect(LX-4,TOP-4,AW+8,H-TOP);
 ctx.fillStyle='#e8eeff';ctx.textBaseline='middle';const hy=TOP*.68;
 ctx.font='600 '+Math.max(14,R*.8)+'px Fredoka,sans-serif';ctx.textAlign='left';ctx.fillText('Pontos '+score,LX+10,hy);
 ctx.textAlign='center';ctx.fillText('Fase '+level,W/2,hy);ctx.textAlign='right';ctx.fillText('Recorde '+Math.max(best,score),LX+AW-10,hy);
 ctx.strokeStyle='rgba(255,80,80,.7)';ctx.setLineDash([8,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(LX,DEAD);ctx.lineTo(LX+AW,DEAD);ctx.stroke();ctx.setLineDash([]);
 if(sprites.length){
  grid.forEach((row,r)=>row.forEach((v,c)=>{if(v!=null)spr(v,px(r,c),py(r))}));
  fall.forEach(f=>spr(f.c,f.x,f.y));
  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l/.45);ctx.fillStyle=PAL[p.c];ctx.beginPath();ctx.arc(p.x,p.y,R*.18,0,7);ctx.fill();ctx.globalAlpha=1});
  if(state=='play'){
   if(!ball){ctx.fillStyle='rgba(255,255,255,.55)';guide().forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,R*.12,0,7);ctx.fill()})}
   ctx.fillStyle='#16306e';ctx.beginPath();ctx.arc(SX,SY,R*1.45,0,7);ctx.fill();

   ctx.textAlign='right';ctx.fillText('descida em '+Math.max(0,limit()-miss),LX+AW,SY+R*1.6);
   if(ball)spr(ball.c,ball.x,ball.y)}}}
const spr=(i,x,y,k=1)=>{const o=sprites[i],s=o.width/DPR*k;ctx.drawImage(o,x-s/2,y-s/2,s,s)};
function aimTo(e){const dx=e.clientX-SX,dy=SY-e.clientY;if(dy>8)ang=Math.min(Math.PI-.17,Math.max(.17,Math.atan2(dy,dx)))}

<script>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  sr.innerHTML = ok.length
    ? ok.map(g => `<a href="${url(g)}" target="_blank" rel="noopener"><span class="th">${arte(g)}</span>${esc(g.titulo)}</a>`).join('')
    : '<p>Nenhum jogo com esse nome.</p>';
  let n = 0;
  grid.querySelectorAll('.tile').forEach(a => { const s = a.dataset.n.includes(t); a.style.display = s ? '' : 'none'; if (s) n++; });
  vazio.style.display = n ? 'none' : 'block';
}
function abrir(v){
  sp.classList.toggle('on', v);
  bb.setAttribute('aria-pressed', v); bb.setAttribute('aria-expanded', v);
  if (v) { filtrar(); q.focus(); } else { q.value = ''; filtrar(); bb.focus(); }
}

addEventListener('keydown', e => { if (e.key === 'Escape' && sp.classList.contains('on')) abrir(false); });

  document.title = g.titulo + ' · VHN Labs';
